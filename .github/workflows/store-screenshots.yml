name: TapLead localized screenshot upload
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: taplead-storefront-screenshots
  cancel-in-progress: false
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography
      - name: Download the immutable exported artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/storefront-export
          gh release download storefront-assets-2026-10-10 --repo lanray07/TapLead --pattern 'TapLead-storefront-all-50-locales.zip' --dir artifacts
          python -m zipfile -e artifacts/TapLead-storefront-all-50-locales.zip artifacts/storefront-export
      - name: Upload exact locale screenshots and retain matching assets
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: python scripts/store-screenshots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TapLead-localized-screenshot-upload-report
          path: artifacts/storefront/
          retention-days: 14
